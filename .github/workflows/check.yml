name: API 21 compatibility

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - uses: gradle/actions/setup-gradle@v5
      - name: Tests, lint, unsigned release
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --console=plain
      - name: Check final API 21 artifacts
        run: python3 scripts/verify_api21_apks.py --allow-unsigned
