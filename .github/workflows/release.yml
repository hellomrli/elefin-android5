name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk = 36. Install it explicitly rather than relying on whatever
      # the runner image happens to ship - AGP will not download platforms itself.
      - name: Install SDK platform 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # Without an NDK, AGP's stripDebugSymbols task silently skips and the
      # prebuilt libc++_shared.so ships with debug info (9.2 MB vs ~1 MB
      # stripped). Same version as the local toolchain that produced verified
      # artifacts.
      - name: Install NDK (strips jniLibs)
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease --stacktrace

      # The build signs with the keystore committed in the repo (see README-ANDROID5.md),
      # so no signing secrets are needed here.
      - name: List outputs
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elefin-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Only on a v* tag. Globbing rather than naming the files keeps this working
      # whichever way the per-ABI output naming resolves.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
