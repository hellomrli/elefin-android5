name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # compileSdk = 36. Install it explicitly rather than relying on whatever
      # the runner image happens to ship - AGP will not download platforms itself.
      - name: Install SDK platform 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # Without an NDK, AGP's stripDebugSymbols task silently skips and the
      # prebuilt libc++_shared.so ships with debug info (9.2 MB vs ~1 MB
      # stripped). Same version as the local toolchain that produced verified
      # artifacts.
      - name: Install NDK (strips jniLibs)
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore private release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ELEFIN_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/elefin-release.keystore"

      - name: Test, lint and build API 21 release
        env:
          ELEFIN_KEYSTORE_FILE: ${{ runner.temp }}/elefin-release.keystore
          ELEFIN_STORE_PASSWORD: ${{ secrets.ELEFIN_STORE_PASSWORD }}
          ELEFIN_KEY_ALIAS: ${{ secrets.ELEFIN_KEY_ALIAS }}
          ELEFIN_KEY_PASSWORD: ${{ secrets.ELEFIN_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace

      - name: Verify release version, API 21 APKs and legacy signing
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/verify_api21_apks.py --release-tag "$RELEASE_TAG"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/elefin-release.keystore"

      - name: List outputs
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: elefin-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Preserve R8 mapping for crash reports
        uses: actions/upload-artifact@v6
        with:
          name: elefin-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # Only on a v* tag. Globbing rather than naming the files keeps this working
      # whichever way the per-ABI output naming resolves.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Elefin ${{ github.ref_name }} — Android 5 修复与性能优化
          body_path: releases/${{ github.ref_name }}.md
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: "true"
